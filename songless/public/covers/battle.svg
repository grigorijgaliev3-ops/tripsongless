<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#141428"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.18" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.8" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vsFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd48a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#g1)"/>
  <rect width="600" height="600" fill="url(#g2)"/>

  <!-- левый меч -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M184 434 L206 456 L450 190 Z" fill="#f59e0b"/>
    <path d="M191 430 L444 187" stroke="#ffe2a8" stroke-width="4" opacity="0.5"/>
    <path d="M158 408 L232 482" stroke="#f59e0b" stroke-width="20"/>
    <path d="M195 445 L150 490" stroke="#b45309" stroke-width="22"/>
    <circle cx="140" cy="500" r="13" fill="#f59e0b"/>

    <!-- правый меч -->
    <path d="M394 456 L416 434 L150 190 Z" fill="#22d3ee"/>
    <path d="M409 430 L156 187" stroke="#c7f9ff" stroke-width="4" opacity="0.5"/>
    <path d="M442 408 L368 482" stroke="#22d3ee" stroke-width="20"/>
    <path d="M405 445 L450 490" stroke="#0e7490" stroke-width="22"/>
    <circle cx="460" cy="500" r="13" fill="#22d3ee"/>
  </g>

  <!-- VS -->
  <ellipse cx="300" cy="330" rx="138" ry="88" fill="#05050a" opacity="0.7" filter="url(#soft)"/>
  <text x="300" y="376" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="148" font-weight="900" letter-spacing="6"
        fill="url(#vsFill)">VS</text>
</svg>
